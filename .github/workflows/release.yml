# Builds the addon zip and uploads it to CurseForge and GitHub Releases
# whenever a version tag (e.g. v1.1.0) is pushed.
#
# Before it can upload to CurseForge:
#   1. Create the project on CurseForge and add its id to the TOC:
#        ## X-Curse-Project-ID: 123456
#   2. Add a repository secret CF_API_KEY (CurseForge -> My API Tokens).
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
